<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="t d">
  <title id="t">How a Prospecto round works</title>
  <desc id="d">Five stages: evidence researched by Gemini and verified in code; a deterministic model value stored in Tiger Postgres; a fixed-price round; pro-rata settlement in mock USDC; non-transferable participation receipts on Solana Devnet.</desc>
  <style>
    /* One 7.5 s cycle: a packet travels the rail and each card lights in its own color as the packet passes. */
    .card{animation:card 7.5s ease-in-out infinite}
    @keyframes card{0%,26%,100%{stroke-opacity:.3;fill-opacity:0}6%,18%{stroke-opacity:1;fill-opacity:.1}}
    .num{animation:num 7.5s ease-in-out infinite}
    @keyframes num{0%,26%,100%{opacity:.7}6%,18%{opacity:1}}
    .arw{animation:arw 7.5s ease-in-out infinite}
    @keyframes arw{0%,26%,100%{opacity:.4;transform:none}8%,18%{opacity:1;transform:translateX(3px)}}
    .c1{animation-delay:.3s}.c2{animation-delay:1.8s}.c3{animation-delay:3.3s}.c4{animation-delay:4.8s}.c5{animation-delay:6.3s}
    .a1{animation-delay:1.2s}.a2{animation-delay:2.7s}.a3{animation-delay:4.2s}.a4{animation-delay:5.7s}
    .packet{animation:packet 7.5s cubic-bezier(.6,0,.4,1) infinite}
    @keyframes packet{
      0%{transform:translateX(0);opacity:0;fill:#5BD06A}
      6%{opacity:1}
      12%{transform:translateX(0);fill:#5BD06A}
      32%{transform:translateX(220px);fill:#7FA7C9}
      52%{transform:translateX(440px);fill:#D9B45A}
      72%{transform:translateX(660px);fill:#E39A4B}
      92%{transform:translateX(880px);fill:#9C8CF2;opacity:1}
      100%{transform:translateX(880px);fill:#9C8CF2;opacity:0}}
    .trail{animation:trail 7.5s cubic-bezier(.6,0,.4,1) infinite}
    @keyframes trail{0%,12%{transform:scaleX(0)}92%{transform:scaleX(1);opacity:1}100%{transform:scaleX(1);opacity:0}}
    @media (prefers-reduced-motion: reduce){*{animation:none!important}}
  </style>
  <defs>
    <linearGradient id="rail" x1="160" x2="1040" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#5BD06A"/>
      <stop offset=".25" stop-color="#7FA7C9"/>
      <stop offset=".5" stop-color="#D9B45A"/>
      <stop offset=".75" stop-color="#E39A4B"/>
      <stop offset="1" stop-color="#9C8CF2"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="430" rx="18" fill="#0A0A09"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" letter-spacing="2" fill="#ECE5D3" opacity=".65">
    <text x="60" y="56">THE REAL LAYER · EVERY NUMBER TRACES TO A SOURCE</text>
  </g>
  <rect x="60" y="72" width="1080" height="1" fill="#ECE5D3" opacity=".4"/>

  <g font-family="Georgia, 'Times New Roman', Times, serif" fill="#ECE5D3">
    <g>
      <rect class="card c1" x="60" y="104" width="200" height="236" rx="8" fill="#5BD06A" fill-opacity="0" stroke="#5BD06A" stroke-opacity=".3" stroke-width="1.5"/>
      <text class="num c1" x="80" y="146" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#5BD06A">01</text>
      <text x="80" y="190" font-size="30" font-weight="700">Evidence</text>
      <text x="80" y="232" font-size="20" font-style="italic" opacity=".85">Gemini finds</text>
      <text x="80" y="258" font-size="20" font-style="italic" opacity=".85">and quotes;</text>
      <text x="80" y="284" font-size="20" font-style="italic" opacity=".85">code verifies</text>
      <text x="80" y="318" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#5BD06A" opacity=".8">GEMINI</text>
    </g>
    <g>
      <rect class="card c2" x="280" y="104" width="200" height="236" rx="8" fill="#7FA7C9" fill-opacity="0" stroke="#7FA7C9" stroke-opacity=".3" stroke-width="1.5"/>
      <text class="num c2" x="300" y="146" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#7FA7C9">02</text>
      <text x="300" y="190" font-size="30" font-weight="700">Valuation</text>
      <text x="300" y="232" font-size="20" font-style="italic" opacity=".85">Versioned,</text>
      <text x="300" y="258" font-size="20" font-style="italic" opacity=".85">deterministic</text>
      <text x="300" y="284" font-size="20" font-style="italic" opacity=".85">model value</text>
      <text x="300" y="318" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#7FA7C9" opacity=".8">TIGER POSTGRES</text>
    </g>
    <g>
      <rect class="card c3" x="500" y="104" width="200" height="236" rx="8" fill="#D9B45A" fill-opacity="0" stroke="#D9B45A" stroke-opacity=".3" stroke-width="1.5"/>
      <text class="num c3" x="520" y="146" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#D9B45A">03</text>
      <text x="520" y="190" font-size="30" font-weight="700">Round</text>
      <text x="520" y="232" font-size="20" font-style="italic" opacity=".85">Fixed unit</text>
      <text x="520" y="258" font-size="20" font-style="italic" opacity=".85">price, timed,</text>
      <text x="520" y="284" font-size="20" font-style="italic" opacity=".85">capped target</text>
      <text x="520" y="318" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#D9B45A" opacity=".8">HONO API</text>
    </g>
    <g>
      <rect class="card c4" x="720" y="104" width="200" height="236" rx="8" fill="#E39A4B" fill-opacity="0" stroke="#E39A4B" stroke-opacity=".3" stroke-width="1.5"/>
      <text class="num c4" x="740" y="146" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#E39A4B">04</text>
      <text x="740" y="190" font-size="30" font-weight="700">Settlement</text>
      <text x="740" y="232" font-size="20" font-style="italic" opacity=".85">Pro-rata,</text>
      <text x="740" y="258" font-size="20" font-style="italic" opacity=".85">1% fee, exact</text>
      <text x="740" y="284" font-size="20" font-style="italic" opacity=".85">refunds</text>
      <text x="740" y="318" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#E39A4B" opacity=".8">MOCK USDC · NESSIE</text>
    </g>
    <g>
      <rect class="card c5" x="940" y="104" width="200" height="236" rx="8" fill="#9C8CF2" fill-opacity="0" stroke="#9C8CF2" stroke-opacity=".3" stroke-width="1.5"/>
      <text class="num c5" x="960" y="146" font-family="ui-monospace, Menlo, monospace" font-size="18" fill="#9C8CF2">05</text>
      <text x="960" y="190" font-size="30" font-weight="700">Receipts</text>
      <text x="960" y="232" font-size="20" font-style="italic" opacity=".85">Non-transferable</text>
      <text x="960" y="258" font-size="20" font-style="italic" opacity=".85">participation</text>
      <text x="960" y="284" font-size="20" font-style="italic" opacity=".85">units</text>
      <text x="960" y="318" font-family="ui-monospace, Menlo, monospace" font-size="15" fill="#9C8CF2" opacity=".8">SOLANA DEVNET</text>
    </g>
  </g>
  <g fill="none" stroke-width="2">
    <path class="arw a1" d="M262 222 l14 0 l-5 -5 M276 222 l-5 5" stroke="#7FA7C9"/>
    <path class="arw a2" d="M482 222 l14 0 l-5 -5 M496 222 l-5 5" stroke="#D9B45A"/>
    <path class="arw a3" d="M702 222 l14 0 l-5 -5 M716 222 l-5 5" stroke="#E39A4B"/>
    <path class="arw a4" d="M922 222 l14 0 l-5 -5 M936 222 l-5 5" stroke="#9C8CF2"/>
  </g>

  <!-- rail: a faint full spectrum, a filling trail, and a traveling packet -->
  <rect x="160" y="364" width="880" height="2" rx="1" fill="url(#rail)" opacity=".25"/>
  <rect class="trail" x="160" y="364" width="880" height="2" rx="1" fill="url(#rail)" style="transform-origin:160px 365px"/>
  <g fill="#ECE5D3" opacity=".5">
    <circle cx="160" cy="365" r="3"/><circle cx="380" cy="365" r="3"/><circle cx="600" cy="365" r="3"/><circle cx="820" cy="365" r="3"/><circle cx="1040" cy="365" r="3"/>
  </g>
  <g class="packet" fill="#5BD06A" opacity="0">
    <circle cx="160" cy="365" r="16" fill="url(#halo)"/>
    <circle cx="160" cy="365" r="6"/>
  </g>

  <text x="60" y="406" font-family="Georgia, serif" font-style="italic" font-size="19" fill="#ECE5D3" opacity=".7">Simulated funds only. Receipts carry no ownership, cash value, redemption or dividends.</text>
</svg>
